<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06101F" />
    <script>
      // Resolve the theme before first paint so the console never flashes the wrong world.
      (function () {
        try {
          var saved = window.localStorage.getItem("aegis.theme");
          var mode = saved === "light" || saved === "dark" ? saved : "dark";
          var root = document.documentElement;
          root.setAttribute("data-theme", mode);
          root.classList.toggle("dark", mode === "dark");
          root.classList.toggle("light", mode === "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", mode === "dark" ? "#06101F" : "#E9EFF7");
        } catch (error) {
          /* storage unavailable — the default dark console remains */
        }
      })();
    </script>
    <meta
      name="description"
      content="CyberGuard AI — AI-driven cyber threat intelligence and risk analytics platform. Evidence-backed detection, validated exposure and explainable risk scoring."
    />
    <title>CyberGuard AI — AI Threat Intelligence &amp; Risk Analytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
